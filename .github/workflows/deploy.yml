name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy by hand from the Actions tab.
  workflow_dispatch:

# The permissions the deploy needs; nothing more.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. A running deploy finishes rather than
# being cancelled, so a half-published site is never left behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the Node the site is built with locally.
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v6

      # `output: "export"` in next.config.ts writes the static site to out/.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
